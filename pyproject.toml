[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vireo-support"
version = "0.1.0"
description = "Vireo Audio support analytics: fair agent scorecard + defective-lot alert"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
